name: Secure CI/CD Pipeline (OWASP-Mapped)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ─────────────────────────────────────────────────────────────────────────────
# OWASP Secure Coding Practices – Full Checklist Coverage
# Each job maps to one or more OWASP categories. No PR merges to main unless
# ALL jobs pass. Branch protection rules must enforce this.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 – SECRET & CREDENTIAL DETECTION
  # OWASP: Data Protection, Authentication & Password Management
  # Catches: hardcoded secrets, committed .env files, API keys in history
  # ═══════════════════════════════════════════════════════════════════════════
  secret-detection:
    name: 🔑 Secret & Credential Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history — catches secrets in old commits too

      - name: Gitleaks – Scan full commit history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check .env files are not committed
        run: |
          if git ls-files | grep -E '\.env$' | grep -v '\.env\.example'; then
            echo "❌ .env file committed to repository. Remove it immediately."
            exit 1
          fi
          echo "✅ No .env files found in tracked files."

      - name: Check for hardcoded connection strings
        run: |
          if grep -rn --include="*.js" --include="*.ts" --include="*.py" \
            -E "(postgres|mysql|mongodb):\/\/[^$\{]" .; then
            echo "❌ Hardcoded connection string detected."
            exit 1
          fi
          echo "✅ No hardcoded connection strings found."

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 – DEPENDENCY VULNERABILITY SCANNING
  # OWASP: General Coding Practices, System Configuration
  # Catches: known CVEs in npm/pip packages, outdated dependencies
  # ═══════════════════════════════════════════════════════════════════════════
  dependency-audit:
    name: 📦 Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit – Backend
        run: |
          cd backend
          npm install
          npm audit --audit-level=high

      - name: npm audit – Frontend
        run: |
          cd frontend
          npm install
          npm audit --audit-level=high

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip-audit – Python backend dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 – STATIC ANALYSIS & SAST
  # OWASP: Input Validation, Output Encoding, Error Handling, Memory Mgmt
  # Catches: injection patterns, insecure functions, eval(), weak crypto
  # ═══════════════════════════════════════════════════════════════════════════
  static-analysis:
    name: 🔬 Static Analysis (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Bandit – Python SAST (maps findings to CWE)
        run: |
          pip install bandit
          bandit -r backend/app \
            -ll \
            -f json \
            -o bandit-report.json \
            --exit-zero
          # Fail on HIGH severity
          bandit -r backend/app -lll

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ESLint with security plugin – Frontend + Backend JS
        run: |
          npm install -g eslint eslint-plugin-security eslint-plugin-no-secrets
          cd frontend
          npm install
          npx eslint src/ \
            --rule '{"no-eval": "error", "no-implied-eval": "error"}' \
            --ext .js,.jsx,.ts,.tsx

      - name: Semgrep – OWASP Top 10 ruleset
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/nodejs
            p/python
            p/jwt
            p/sql-injection
            p/xss

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4 – BACKEND UNIT & INTEGRATION TESTS
  # OWASP: Authentication, Session Management, Access Control, DB Security
  # Covers: auth logic, RBAC, input validators, parameterized queries
  # ═══════════════════════════════════════════════════════════════════════════
  backend-tests:
    name: 🧪 Backend Tests (Unit + Integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run all backend tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci-only
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/ \
            -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 5 – FRONTEND TESTS & BUILD
  # OWASP: Input Validation (client-side), Output Encoding, Data Protection
  # Covers: form validation, XSS prevention, protected route guards
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-tests:
    name: 🖥️ Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test -- --coverage --watchAll=false

      - name: Build frontend (catches compile-time errors)
        run: |
          cd frontend
          npm run build

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 6 – AUTHENTICATION & SESSION SECURITY TESTS
  # OWASP: Authentication & Password Management, Session Management
  # Covers: brute force lockout, password policy, JWT handling, logout
  # ═══════════════════════════════════════════════════════════════════════════
  auth-security-tests:
    name: 🔐 Auth & Session Security Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run auth-specific security test suite
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci-only
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/security/ -v -k "auth or session or password or jwt or rbac"

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 7 – FILE UPLOAD SECURITY TESTS
  # OWASP: File Management
  # Covers: type spoofing, oversized files, path traversal via filename
  # ═══════════════════════════════════════════════════════════════════════════
  file-upload-tests:
    name: 📁 File Upload Security Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run file upload security tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci-only
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/security/test_file_upload.py -v

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 8 – INPUT VALIDATION FUZZING
  # OWASP: Input Validation, Output Encoding, Database Security
  # Covers: SQL injection, XSS payloads, oversized input, Unicode tricks
  # ═══════════════════════════════════════════════════════════════════════════
  fuzzing:
    name: 🎯 Input Validation Fuzzing
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt pytest pytest-asyncio httpx hypothesis

      - name: Run hypothesis fuzzing suite
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci-only
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/fuzz/ -v --hypothesis-seed=0

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 9 – SONARCLOUD QUALITY GATE
  # OWASP: All categories (SonarCloud maps to OWASP Top 10 & CWE)
  # Quality gate: blocks merge on unreviewed security hotspots
  # ═══════════════════════════════════════════════════════════════════════════
  sonarcloud:
    name: 🔍 SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
