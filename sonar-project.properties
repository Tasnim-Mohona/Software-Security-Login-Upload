# sonar-project.properties
# ─────────────────────────────────────────────────────────────────────────────
# SonarCloud configuration for CS 4417/6417 Secure SDLC Project
#
# Setup:
#   1. Go to https://sonarcloud.io and sign in with GitHub
#   2. Import your repository
#   3. Replace YOUR_PROJECT_KEY and YOUR_ORGANIZATION below
#   4. Add SONAR_TOKEN to GitHub repo Secrets
# ─────────────────────────────────────────────────────────────────────────────

sonar.projectKey=YOUR_PROJECT_KEY
sonar.organization=YOUR_ORGANIZATION
sonar.projectName=Secure SDLC Auth Project

# ─── SOURCE PATHS ────────────────────────────────────────────────────────────
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src

# ─── EXCLUSIONS ──────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/.venv/**,\
  **/migrations/**,\
  **/dist/**,\
  **/build/**,\
  **/*.min.js,\
  **/coverage/**

sonar.test.inclusions=\
  backend/tests/**,\
  frontend/src/**/*.test.*,\
  frontend/src/**/*.spec.*

# ─── LANGUAGES ───────────────────────────────────────────────────────────────
# SonarCloud auto-detects, but being explicit is better
sonar.python.version=3.11
sonar.javascript.node.maxspace=4096

# ─── COVERAGE REPORTS ────────────────────────────────────────────────────────
# Backend: generated by pytest-cov
sonar.python.coverage.reportPaths=backend/coverage.xml

# Frontend: generated by jest --coverage
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ─── QUALITY GATE THRESHOLDS (configured in SonarCloud UI) ───────────────────
# These are documented here for reference — set them in the SonarCloud UI:
#
#   Metric                    | Condition    | Value
#   --------------------------|--------------|-------
#   Security Hotspots         | reviewed %   | >= 100%
#   Vulnerabilities           | count (new)  | = 0
#   Bugs (new code)           | count        | = 0
#   Coverage (new code)       | %            | >= 75%
#   Duplicated lines (new)    | %            | <= 3%
#   Security Rating           | letter       | = A
#
# A PR CANNOT merge to main if any of these thresholds are violated.

# ─── SECURITY RULES ENABLED ──────────────────────────────────────────────────
# These SonarCloud security rules are active for this project.
# Reference: https://rules.sonarsource.com
#
# Python rules:
#   python:S2076  - OS commands should not be vulnerable to injection attacks
#   python:S2078  - LDAP queries should not be vulnerable to injection
#   python:S2083  - I/O function calls should not be vulnerable to path injection
#   python:S3649  - DB queries should not be vulnerable to SQL injection
#   python:S4426  - Cryptographic keys should be robust
#   python:S5542  - Encryption algorithms should be used with secure mode/padding
#   python:S5547  - Cipher algorithms should be robust
#
# JavaScript rules:
#   javascript:S5122 - CORS should not allow all origins
#   javascript:S5144 - SSRF attacks should be prevented
#   javascript:S5145 - Log injection should be prevented
#   javascript:S6270 - AWS permissions should be restricted

# ─── ENCODING ────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
